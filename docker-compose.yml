services:
  api:
    build: .
    profiles: ["portable"]
    environment:
      ENTANGLE_DATA_MODE: live
      ENTANGLE_DATABASE_PROVIDER: portable-mongo
      ENTANGLE_AI_PROVIDER: disabled
      ENTANGLE_SEARCH_PROVIDER: disabled
      ENTANGLE_GITHUB_PROVIDER: disabled
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB_NAME: quantum_github
    ports: ["8000:8000"]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health/ready', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
  offline-api:
    build: .
    profiles: ["offline"]
    environment:
      ENTANGLE_DATA_MODE: snapshot
      ENTANGLE_DATABASE_PROVIDER: portable-mongo
      ENTANGLE_SNAPSHOT_PATH: /app/preservation/fixtures/offline
      ENTANGLE_AI_PROVIDER: offline
      ENTANGLE_SEARCH_PROVIDER: disabled
      ENTANGLE_GITHUB_PROVIDER: github
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health/ready', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
  mongo:
    image: mongo:8.0
    profiles: ["portable"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes: ["ollama-data:/root/.ollama"]
    ports: ["11434:11434"]
volumes:
  mongo-data:
  ollama-data:
